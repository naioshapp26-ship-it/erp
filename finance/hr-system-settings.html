<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعدادات النظام - نايوش HCM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/finance/hr-portal-shell.css">
  <style>
    body { font-family: 'Tajawal', sans-serif; background: #f3f4f6; color: #0f172a; }
    .topbar {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 14px; color: #64748b; }
    .topbar-actions i { cursor: pointer; }
  </style>
</head>
<body class="hr-shell-active" data-hr-page="system-settings">
  <div class="hr-app-layout">
    <aside class="hr-sidebar" id="hr-sidebar"></aside>
    <main class="hr-main">
      <div class="hr-main-inner settings-page">
        <div class="topbar">
          <div class="font-bold text-slate-600">مرحباً بك في إعدادات النظام</div>
          <div class="topbar-actions">
            <i class="fas fa-magnifying-glass"></i>
            <i class="fas fa-expand"></i>
            <i class="fas fa-bell"></i>
            <i class="fas fa-user-circle text-lg"></i>
          </div>
        </div>
        <div class="settings-crumb">الرئيسية / إعدادات النظام</div>
        <div class="flex items-center justify-between mb-4">
          <div>
            <h1 class="hr-page-title">إعدادات النظام</h1>
            <p class="hr-page-subtitle mb-0">كل الإعدادات جاهزة للتشغيل الفوري بنفس ترتيب شاشة العميل.</p>
          </div>
        </div>
        <div id="settingsGrid" class="settings-grid"></div>
      </div>
    </main>
  </div>
  <script src="/finance/hr-portal-shell.js"></script>
  <script>
    const headers = { 'Content-Type': 'application/json', 'x-entity-type': 'HQ', 'x-entity-id': 'HQ001' };

    function gearLink(item) {
      const tag = item.isNew ? '<span class="settings-new">جديد</span>' : '';
      return `<a href="${item.href}"><i class="fas fa-gear"></i><span>${item.label}</span>${tag}</a>`;
    }

    async function loadCatalog() {
      const grid = document.getElementById('settingsGrid');
      grid.innerHTML = '<div class="text-slate-500">جاري التحميل...</div>';
      const res = await fetch('/api/hr/system-settings/catalog', { headers });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'فشل التحميل');
      grid.innerHTML = data.groups.map((group) => `
        <section class="settings-card">
          <h3>${group.title}</h3>
          ${group.items.map(gearLink).join('')}
        </section>
      `).join('');
    }

    loadCatalog().catch((err) => {
      document.getElementById('settingsGrid').innerHTML = `<div class="text-rose-600 font-bold">${err.message}</div>`;
    });
  </script>
</body>
</html>
