<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات - نايوش HCM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/finance/hr-portal-shell.css?v=hcm-settings-tiles-20260823">
</head>
<body class="hr-shell-active settings-page" data-hr-page="system-settings">
  <div class="hr-app-layout">
    <aside class="hr-sidebar" id="hr-sidebar"></aside>
    <main class="hr-main">
      <div class="hr-main-inner">
        <section class="settings-board">
          <div class="settings-crumb">الرئيسية / <b>الإعدادات</b></div>
          <div class="settings-head">
            <div>
              <h1>الإعدادات</h1>
              <p>لوحة مربعات مستقلة لتشغيل موارد بشرية، حضور، رواتب، نماذج وطلبات من مكان واحد.</p>
            </div>
            <input id="settingsSearch" class="settings-search" type="search" placeholder="بحث في الإعدادات">
          </div>
          <div id="settingsGrid"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="/finance/hr-portal-shell.js?v=hcm-settings-tiles-20260823"></script>
  <script>
    const headers = { 'Content-Type': 'application/json', 'x-entity-type': 'HQ', 'x-entity-id': 'HQ001' };
    let catalogGroups = [];

    function iconClass(icon) {
      const name = String(icon || 'fa-gear').replace(/^fa-/, '');
      return `fas fa-${name}`;
    }

    function renderCatalog(filter = '') {
      const q = String(filter || '').trim();
      const grid = document.getElementById('settingsGrid');
      const groups = catalogGroups.map((group) => ({
        ...group,
        items: (group.items || []).filter((item) => !q || item.label.includes(q) || group.title.includes(q))
      })).filter((group) => group.items.length);

      grid.innerHTML = groups.map((group) => `
        <section class="settings-section">
          <h2>${group.title}</h2>
          <div class="settings-tiles">
            ${group.items.map((item) => `
              <a class="settings-tile" href="${item.href || '/hr/system-settings/' + item.key}">
                ${item.isNew ? '<span class="settings-new">جديد</span>' : ''}
                <span class="settings-tile-icon"><i class="${iconClass(item.icon)}"></i></span>
                <span class="settings-tile-label">${item.label}</span>
              </a>
            `).join('')}
          </div>
        </section>
      `).join('') || '<div class="text-slate-500 font-bold">لا توجد نتائج</div>';
    }

    async function loadCatalog() {
      const grid = document.getElementById('settingsGrid');
      grid.innerHTML = '<div class="text-slate-500">جاري التحميل...</div>';
      const res = await fetch('/api/hr/system-settings/catalog', { headers });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'فشل التحميل');
      catalogGroups = data.groups || [];
      renderCatalog();
    }

    document.getElementById('settingsSearch').addEventListener('input', (e) => renderCatalog(e.target.value));
    loadCatalog().catch((err) => {
      document.getElementById('settingsGrid').innerHTML = `<div class="text-rose-600 font-bold">${err.message}</div>`;
    });
  </script>
</body>
</html>
