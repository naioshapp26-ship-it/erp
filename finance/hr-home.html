<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المدير العام - نظام نايوش</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: #f9fafb;
            min-height: 100vh;
        }

        :root {
            --naiosh-red: #b91c1c;
            --naiosh-red-deep: #7f1d1d;
            --naiosh-gold: #c4a35a;
            --naiosh-gold-soft: rgba(196, 163, 90, 0.18);
        }

        body.finance-home-theme {
            background:
                radial-gradient(circle at 12% 0%, rgba(220, 38, 38, 0.1), transparent 42%),
                radial-gradient(circle at 88% 18%, var(--naiosh-gold-soft), transparent 38%),
                linear-gradient(160deg, #fffefe 0%, #f8f7f5 55%, #f3f2f0 100%) !important;
            color: #1e293b;
        }

        body.finance-home-theme .text-slate-900,
        body.finance-home-theme .text-slate-800,
        body.finance-home-theme .hr-main h1,
        body.finance-home-theme .hr-main h2,
        body.finance-home-theme .hr-main h3,
        body.finance-home-theme .hr-main p {
            color: #0f172a !important;
        }

        body.finance-home-theme .opacity-90 {
            opacity: 1 !important;
            color: #334155 !important;
        }

        body.finance-home-theme .bg-white {
            background-color: rgba(255, 255, 255, 0.95) !important;
            color: #0f172a !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body.finance-home-theme .bg-white .text-slate-900,
        body.finance-home-theme .bg-white .text-slate-800,
        body.finance-home-theme .bg-white .text-gray-800,
        body.finance-home-theme .bg-white h1,
        body.finance-home-theme .bg-white h2,
        body.finance-home-theme .bg-white h3,
        body.finance-home-theme .bg-white span,
        body.finance-home-theme .bg-white a {
            color: #1e293b !important;
        }

        body.finance-home-theme .bg-white p {
            color: #475569 !important;
        }

        body.finance-home-theme .bg-white i.text-gray-300 {
            color: #94a3b8 !important;
        }

        body.finance-home-theme .bg-white i.text-red-600 {
            color: #dc2626 !important;
        }

        .hero-section {
            border-radius: 22px;
            background:
                linear-gradient(120deg, rgba(127, 29, 29, 0.96), rgba(185, 28, 28, 0.9) 55%, rgba(127, 29, 29, 0.88)),
                linear-gradient(135deg, #fff, #fef2f2);
            border: 1px solid rgba(196, 163, 90, 0.35);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
            overflow: hidden;
            position: relative;
            margin-bottom: 1.25rem !important;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: auto -40px -40px auto;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196, 163, 90, 0.35), transparent 70%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-image-wrap img {
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.2);
        }

        .hero-cta-primary {
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            color: #fff;
            box-shadow: 0 14px 28px rgba(185, 28, 28, 0.28);
        }

        .hero-cta-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 32px rgba(185, 28, 28, 0.32);
        }

        .hero-cta-secondary {
            background: #fff;
            border: 1px solid #d1d5db;
            color: #111827;
        }

        .hero-cta-secondary:hover {
            border-color: #b91c1c;
            color: #7f1d1d;
        }

        .hr-section-block {
            margin-bottom: 1.35rem;
            padding: 1rem 1rem 1.1rem;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(226, 232, 240, 0.95);
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
        }

        .hr-section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 12px;
            font-size: 1.05rem;
            font-weight: 800;
            color: #0f172a;
        }

        .hr-section-title::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--naiosh-gold), #e8d5a3);
            box-shadow: 0 0 0 3px var(--naiosh-gold-soft);
            flex: 0 0 auto;
        }

        /* Module cards: shared erp-module-nav-cards.css (Finance parity) */

        .hr-home-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
        }

        .hr-home-search {
            flex: 1 1 260px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px 14px;
            font-family: inherit;
            font-weight: 700;
        }

        .hr-home-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .hr-home-chip {
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #334155;
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }

        .hr-home-chip.active {
            background: #7f1d1d;
            border-color: #7f1d1d;
            color: #fff;
        }

        .hr-home-stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        body.hr-ess-mode .hr-home-stats {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .hr-home-stat {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
        }

        .hr-home-stat strong {
            display: block;
            font-size: 1.4rem;
            color: #7f1d1d;
        }

        .hr-home-stat span {
            color: #64748b;
            font-size: 13px;
            font-weight: 700;
        }

        .hr-home-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 28px;
            color: #94a3b8;
            font-weight: 800;
        }

        body.hr-ess-mode .floating-actions {
            display: none !important;
        }

        .floating-actions {
            position: fixed;
            left: 20px;
            bottom: 24px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .floating-actions button,
        .floating-actions a {
            width: 48px;
            height: 48px;
            border-radius: 999px;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: #fff;
            box-shadow: 0 12px 24px rgba(127, 29, 29, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .floating-actions button:hover,
        .floating-actions a:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 16px 28px rgba(127, 29, 29, 0.35);
        }

        .floating-actions button:focus-visible,
        .floating-actions a:focus-visible {
            outline: 2px solid #111827;
            outline-offset: 2px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @media (max-width: 1100px) {
            .hr-home-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .hero-section {
                border-radius: 18px;
            }

            .hero-content {
                gap: 1rem;
            }

            .hero-cta-primary,
            .hero-cta-secondary {
                width: 100%;
                justify-content: center;
            }

            .floating-actions {
                left: 12px;
                bottom: 16px;
            }

            .hr-home-stats,
            body.hr-ess-mode .hr-home-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="contrast-overrides.css">
</head>
<body class="finance-home-theme hr-shell-active" data-hr-page="hr-home">
<div class="hr-app-layout">
    <aside class="hr-sidebar" id="hr-sidebar" aria-label="القائمة الجانبية"></aside>
    <main class="hr-main" id="hr-main">
    <div class="container mx-auto px-4 py-8">
        <section class="hero-section p-5 md:p-6 mb-5">
            <div class="hero-content grid grid-cols-1 lg:grid-cols-[1.4fr_0.8fr] gap-4 items-center">
                <div class="text-white lg:pr-2">

                        <i class="fas fa-building" style="color:#e8d5a3"></i>
                        NAIOSH ERP 360
                    </div>

                    <p id="hrHeroLead" class="text-sm md:text-base text-white/90 leading-relaxed mb-4">بطاقات منظمة حسب العمل اليومي — دون تكرار ودون فراغات مشتتة.</p>
                    <div class="flex flex-wrap gap-3">
                        <a href="#hr-sections" class="hero-cta-primary px-5 py-2.5 rounded-xl font-bold transition inline-flex items-center gap-2">
                            <i class="fas fa-th-large"></i>
                            المجموعات
                        </a>
                        <a id="hrHeroSecondaryCta" href="/hr/my-requests" class="hero-cta-secondary px-5 py-2.5 rounded-xl font-bold transition inline-flex items-center gap-2">
                            <i class="fas fa-file-lines"></i>
                            طلب جديد
                        </a>

                <div class="hero-image-wrap flex justify-center lg:justify-end">

                </div>
            </div>
        </section>

        <div class="mb-3 text-slate-900">
            <h1 id="hrHomeTitle" class="text-2xl md:text-3xl font-black mb-1">لوحة الموارد البشرية</h1>
            <p id="hrHomeSubtitle" class="text-base opacity-90">وظائف منظمة في مجموعات واضحة</p>
        </div>

        <div class="mb-6">
            <h3 id="hrHomeSectionLabel" class="text-slate-800 text-lg font-bold mb-3 opacity-90"><i class="fas fa-bars ml-2"></i>المجموعات</h3>
            <div class="hr-home-toolbar">
                <input id="hrHomeSearch" class="hr-home-search" type="search" placeholder="ابحث عن نظام... (Ctrl+K)" aria-label="بحث في أنظمة الموارد البشرية">
                <div class="hr-home-filters" id="hrHomeFilters" aria-label="تصفية حسب القسم"></div>
            </div>
            <div class="hr-home-stats" id="hrHomeStats"></div>
            <div id="hr-sections" aria-live="polite"></div>
            <div id="hr-cards" class="finance-links" aria-live="polite" hidden></div>
        </div>
    </div>
    </main>
</div>

    <script src="/finance/hr-portal-shell.js?v=hcm-ess-rbac-20261018"></script>
    <script>
        const API_BASE = window.location.origin;
        let homeModules = [];
        let homeSections = [];
        let portalMeta = { persona: 'manager', adminHidden: false };
        let activeCategory = 'الكل';

        function authHeaders() {
            const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || '';
            const headers = { 'x-entity-type': 'HQ', 'x-entity-id': 'HQ001' };
            if (token) headers.Authorization = `Bearer ${token}`;
            return headers;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function cardHtml(item) {
            return `
                <a href="${escapeHtml(item.href)}" class="w-full bg-white text-gray-800 px-6 py-4 rounded-xl font-bold shadow-sm hover:shadow-md hover:bg-gray-50 transition flex items-center gap-4 border border-gray-200 hover:border-red-500 group" data-category="${escapeHtml(item.category || '')}" ${item.manager ? 'data-manager="1"' : ''} data-module-key="${escapeHtml(item.key || '')}">
                    <i class="fas ${escapeHtml(item.icon)} text-xl w-8 text-center text-red-600 group-hover:text-red-700 transition"></i>
                    <span class="flex-1 text-right">
                        <span class="block">${escapeHtml(item.label)}</span>
                        ${item.description ? `<span class="block text-xs font-medium text-slate-500 mt-1">${escapeHtml(item.description)}</span>` : ''}
                    </span>
                    <i class="fas fa-chevron-left text-gray-300"></i>
                </a>`;
        }

        function filterItem(item) {
            const query = String(document.getElementById('hrHomeSearch')?.value || '').trim().toLowerCase();
            const categoryOk = activeCategory === 'الكل' || item.category === activeCategory;
            const searchOk = !query
                || String(item.label || '').toLowerCase().includes(query)
                || String(item.category || '').toLowerCase().includes(query)
                || String(item.description || '').toLowerCase().includes(query);
            return categoryOk && searchOk;
        }

        function renderHomeCards() {
            const sectionsWrap = document.getElementById('hr-sections');
            const legacyGrid = document.getElementById('hr-cards');
            if (!sectionsWrap) return;

            const sections = (homeSections.length ? homeSections : [{ id: 'all', title: 'الوظائف', cards: homeModules }])
                .map((section) => ({
                    ...section,
                    cards: (section.cards || []).filter(filterItem)
                }))
                .filter((section) => section.cards.length);

            if (!sections.length) {
                sectionsWrap.innerHTML = '<div class="hr-home-empty">لا توجد أنظمة مطابقة للبحث الحالي</div>';
                if (legacyGrid) legacyGrid.innerHTML = '';
                return;
            }

            sectionsWrap.innerHTML = sections.map((section) => `
                <section class="hr-section-block" data-section-id="${escapeHtml(section.id)}" data-card-count="${section.cards.length}">
                    <h3 class="hr-section-title">${escapeHtml(section.title)}</h3>
                    <div class="finance-links">${section.cards.map(cardHtml).join('')}</div>
                </section>`).join('');
            if (legacyGrid) {
                legacyGrid.hidden = true;
                legacyGrid.innerHTML = '';
            }
        }

        function renderHomeFilters(categories) {
            const wrap = document.getElementById('hrHomeFilters');
            wrap.innerHTML = categories.map((category) => `
                <button type="button" class="hr-home-chip ${category === activeCategory ? 'active' : ''}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>
            `).join('');
            wrap.querySelectorAll('[data-category]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    activeCategory = btn.dataset.category;
                    wrap.querySelectorAll('.hr-home-chip').forEach((chip) => chip.classList.toggle('active', chip.dataset.category === activeCategory));
                    renderHomeCards();
                });
            });
        }

        async function renderHomeStats() {
            const wrap = document.getElementById('hrHomeStats');
            if (portalMeta.adminHidden) {
                wrap.innerHTML = `
                    <div class="hr-home-stat"><strong>${homeModules.length}</strong><span>خدمة ذاتية متاحة</span></div>
                    <div class="hr-home-stat"><strong>طلباتي</strong><span>متابعة الموافقة والرفض</span></div>`;
                return;
            }
            try {
                const dash = await fetch(`${API_BASE}/api/hr/manager-dashboard`, {
                    headers: authHeaders()
                }).then((r) => r.json());
                const pending = dash.pending?.count || 0;
                const managerQueue = dash.pending?.by_stage?.manager || 0;
                wrap.innerHTML = `
                    <div class="hr-home-stat"><strong>${homeModules.length}</strong><span>نظام متاح</span></div>
                    <div class="hr-home-stat"><strong>${pending}</strong><span>عمليات بانتظار إجراء</span></div>
                    <div class="hr-home-stat"><strong>${managerQueue}</strong><span>بانتظار المدير المباشر</span></div>
                    <div class="hr-home-stat"><strong>${homeModules.filter((m) => m.manager).length}</strong><span>أنظمة تمر عبر المدير</span></div>`;
            } catch (_) {
                wrap.innerHTML = `<div class="hr-home-stat"><strong>${homeModules.length}</strong><span>نظام متاح</span></div>`;
            }
        }

        async function loadHomeModules() {
            const res = await fetch(`${API_BASE}/api/hr/home-modules`, {
                headers: authHeaders()
            });
            const data = await res.json();
            if (!data.success) throw new Error('تعذر تحميل الأنظمة');
            portalMeta = {
                persona: data.persona || 'manager',
                adminHidden: !!data.adminHidden,
                title: data.title,
                subtitle: data.subtitle
            };
            homeModules = data.modules || [];
            homeSections = Array.isArray(data.sections) ? data.sections : [];
            window.HR_HOME_MODULES = homeModules;
            window.HR_PORTAL_META = portalMeta;

            const titleEl = document.getElementById('hrHomeTitle');
            const subtitleEl = document.getElementById('hrHomeSubtitle');
            const sectionLabel = document.getElementById('hrHomeSectionLabel');
            if (titleEl && data.title) {
                titleEl.textContent = data.title;
            }
            if (subtitleEl && data.subtitle) subtitleEl.textContent = data.subtitle;
            if (sectionLabel) {
                sectionLabel.innerHTML = portalMeta.adminHidden
                    ? '<i class="fas fa-user ml-2"></i>خدمات الموظف'
                    : '<i class="fas fa-bars ml-2"></i>المجموعات';
            }
            const heroLead = document.getElementById('hrHeroLead');
            const heroSecondary = document.getElementById('hrHeroSecondaryCta');
            if (heroLead) {
                heroLead.textContent = portalMeta.adminHidden
                    ? 'قدّم طلباتك وتابع حالتها من هنا بسهولة.'
                    : 'بطاقات منظمة حسب العمل اليومي — دون تكرار ودون فراغات مشتتة.';
            }
            if (heroSecondary) {
                if (portalMeta.adminHidden) {
                    heroSecondary.href = '/hr/leaves';
                    heroSecondary.innerHTML = '<i class="fas fa-plane-departure"></i> طلب إجازة';
                } else {
                    heroSecondary.href = '/hr/employees';
                    heroSecondary.innerHTML = '<i class="fas fa-user-plus"></i> ملفات الموظفين';
                }
            }
            document.title = (data.title || 'الموارد البشرية') + ' - نظام نايوش';
            document.body.setAttribute('data-hr-persona', portalMeta.persona);
            document.body.classList.toggle('hr-ess-mode', !!portalMeta.adminHidden);

            renderHomeFilters(data.categories || ['الكل']);
            renderHomeStats();
            renderHomeCards();
        }

        async function loadPendingBadge() {
            if (portalMeta.adminHidden) return;
            if (window.HRPortalShell?.refreshBadges) {
                await window.HRPortalShell.refreshBadges();
            }
        }

        async function loadHrData() {
            try {
                await loadHomeModules();
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                if (data && data.status) {
                    console.log('✅ HR home initialized', portalMeta.persona);
                }
            } catch (error) {
                console.error('❌ HR initialization issue:', error);
                const wrap = document.getElementById('hr-sections');
                if (wrap) wrap.innerHTML = '<div class="hr-home-empty">تعذر تحميل الأنظمة. حدّث الصفحة وحاول مرة أخرى.</div>';
            }
            await loadPendingBadge();
        }

        document.getElementById('hrHomeSearch')?.addEventListener('input', renderHomeCards);
        document.getElementById('hrHomeSearch')?.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                window.HRPortalShell?.openModuleSearch?.();
            }
        });

        document.addEventListener('DOMContentLoaded', loadHrData);
        setInterval(loadPendingBadge, 20000);
    </script>
    <script src="/tenant-path-client.js"></script>
    <script src="/finance/hub-page-permissions.js"></script>
    <script src="/finance/finance-smart-search.js"></script>
    <script src="/finance/finance-related-actions.js"></script>

        <a href="/hr/new-hires" title="إضافة - تعيين موظف" aria-label="إضافة - تعيين موظف">
            <i class="fas fa-plus"></i>
        </a>
        <a href="/hr/performance" title="إعجاب - الأداء" aria-label="إعجاب - الأداء">
            <i class="fas fa-heart"></i>
        </a>
        <a href="/hr/notifications-center" title="رسائل - الإشعارات" aria-label="رسائل - الإشعارات">
            <i class="fas fa-comment-dots"></i>
        </a>
        <button type="button" id="scroll-top-button" title="الصعود للأعلى" aria-label="الصعود للأعلى">
            <i class="fas fa-arrow-up"></i>
        </button>
    </nav>
    <script>
        document.getElementById('scroll-top-button')?.addEventListener('click', () => {
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
        });
    </script>
