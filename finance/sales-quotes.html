<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عروض أسعار المبيعات — القيادة المالية 360</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="contrast-overrides.css">
  <style>
    body { font-family: 'Tajawal','Cairo',sans-serif; background: linear-gradient(165deg,#fffefe,#f5f6f7 55%,#eef1f4); min-height:100vh; }
    table { width:100%; border-collapse: collapse; }
    th, td { border-bottom:1px solid #e2e8f0; padding:0.65rem 0.5rem; text-align:right; font-weight:700; }
    input, select, textarea { border:1px solid #cbd5e1; border-radius:0.45rem; padding:0.45rem 0.65rem; width:100%; font-weight:700; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="mb-4 flex flex-wrap gap-2">
    <a href="/finance#section=sales" class="rounded-full border bg-white px-4 py-2 text-sm font-bold">← المبيعات</a>
    <a href="/finance/leadership-doc-settings.html?doc=quotes" class="rounded-full border bg-white px-4 py-2 text-sm font-bold">إعدادات عروض الأسعار</a>
  </div>
  <h1 class="text-2xl font-black text-red-700 mb-1">عروض أسعار المبيعات</h1>
  <p class="text-sm text-slate-600 font-bold mb-4">حفظ وقراءة من PostgreSQL — تُطبَّق إعدادات الصفحة (بادئة/صلاحية/ضريبة).</p>

  <div class="grid lg:grid-cols-2 gap-4">
    <section class="bg-white border border-sky-200 rounded-xl p-4 shadow-sm">
      <h2 class="font-black mb-3">إنشاء عرض سعر</h2>
      <div class="space-y-2">
        <label class="block text-sm font-black">اسم العميل<input id="customer_name" type="text"></label>
        <label class="block text-sm font-black">ملاحظات<textarea id="notes" rows="2"></textarea></label>
        <div class="grid grid-cols-3 gap-2">
          <label class="block text-sm font-black">الصنف<input id="item_name" type="text" value="خدمة"></label>
          <label class="block text-sm font-black">الكمية<input id="qty" type="number" value="1" min="0" step="0.01"></label>
          <label class="block text-sm font-black">السعر<input id="price" type="number" value="100" min="0" step="0.01"></label>
        </div>
        <button id="btn-create" type="button" class="w-full rounded-lg bg-red-700 text-white py-2 font-black">حفظ في قاعدة البيانات</button>
        <p id="form-status" class="text-sm font-bold text-slate-600"></p>
      </div>
    </section>
    <section class="bg-white border border-sky-200 rounded-xl p-4 shadow-sm overflow-auto">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-black">العروض المحفوظة</h2>
        <button id="btn-reload" type="button" class="rounded-lg border px-3 py-1 font-black text-sm">إعادة القراءة</button>
      </div>
      <table>
        <thead><tr><th>الرقم</th><th>العميل</th><th>الإجمالي</th><th>الصلاحية</th><th>الحالة</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="list-status" class="text-sm font-bold text-slate-600 mt-2"></p>
    </section>
  </div>

  <script src="/finance/finance-context.js"></script>
  <script>
    (function () {
      const rowsEl = document.getElementById('rows');
      const formStatus = document.getElementById('form-status');
      const listStatus = document.getElementById('list-status');
      function headers() {
        return Object.assign({ 'Content-Type': 'application/json' }, window.getFinanceHeaders ? window.getFinanceHeaders() : {});
      }
      async function load() {
        listStatus.textContent = 'جاري التحميل…';
        const res = await fetch('/finance/sales-quotes', { headers: headers(), credentials: 'same-origin' });
        const json = await res.json();
        if (!res.ok || !json.success) {
          listStatus.textContent = json.error || 'فشل التحميل';
          return;
        }
        rowsEl.innerHTML = (json.quotes || []).map((q) => `
          <tr>
            <td>${q.quote_number}</td>
            <td>${q.customer_name}</td>
            <td>${Number(q.total_amount).toLocaleString('en-US')}</td>
            <td>${q.valid_until || '-'}</td>
            <td>${q.status}</td>
          </tr>`).join('') || '<tr><td colspan="5">لا توجد عروض بعد</td></tr>';
        listStatus.textContent = `تم التحميل من PostgreSQL — ${json.count} عرض (كيان ${json.entity_id})`;
      }
      async function create() {
        formStatus.textContent = 'جاري الحفظ…';
        const payload = {
          customer_name: document.getElementById('customer_name').value.trim(),
          notes: document.getElementById('notes').value.trim(),
          lines: [{
            item_name: document.getElementById('item_name').value.trim() || 'بند',
            quantity: Number(document.getElementById('qty').value) || 0,
            unit_price: Number(document.getElementById('price').value) || 0
          }]
        };
        const res = await fetch('/finance/sales-quotes', {
          method: 'POST', headers: headers(), credentials: 'same-origin', body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (!res.ok || !json.success) {
          formStatus.textContent = json.error || 'فشل الحفظ';
          formStatus.className = 'text-sm font-bold text-red-700';
          return;
        }
        formStatus.textContent = `تم الحفظ: ${json.quote.quote_number} — إجمالي ${json.quote.total_amount}`;
        formStatus.className = 'text-sm font-bold text-green-700';
        await load();
      }
      document.getElementById('btn-create').onclick = () => create().catch((e) => { formStatus.textContent = e.message; });
      document.getElementById('btn-reload').onclick = () => load().catch((e) => { listStatus.textContent = e.message; });
      function start() { load().catch((e) => { listStatus.textContent = e.message; }); }
      if (window.whenFinanceContextReady) window.whenFinanceContextReady(start); else start();
    })();
  </script>
</body>
</html>
