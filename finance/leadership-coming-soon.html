<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قيد التطوير — القيادة المالية 360</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="contrast-overrides.css">
  <style>
    body { font-family: 'Tajawal', 'Cairo', sans-serif; background: #f8fafc; min-height: 100vh; }
    .badge-dev {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;
      border-radius: 999px; padding: 0.35rem 0.85rem; font-weight: 800; font-size: 0.85rem;
    }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-10">
    <p class="badge-dev mb-4" id="status-badge"><i class="fas fa-screwdriver-wrench" aria-hidden="true"></i> قيد التطوير</p>
    <h1 class="text-2xl md:text-3xl font-black text-slate-900 mb-2" id="page-title">وظيفة قيد التطوير</h1>
    <p class="text-slate-600 leading-relaxed mb-2" id="section-line"></p>
    <p class="text-slate-500 leading-relaxed mb-8" id="note-line">
      هذه الصفحة ضمن منظومة القيادة المالية 360 ولم تُنفَّذ تشغيليًا بعد. لا توجد عمليات مالية شكلية من هذه الشاشة.
    </p>
    <div class="flex flex-wrap gap-3">
      <a href="/finance" class="inline-flex items-center gap-2 rounded-xl bg-red-700 text-white px-5 py-3 font-bold hover:bg-red-800 transition">
        <i class="fas fa-compass" aria-hidden="true"></i>
        العودة للقيادة المالية 360
      </a>
      <a href="/" class="inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-5 py-3 font-bold text-slate-700 hover:border-red-600 transition">
        <i class="fas fa-house" aria-hidden="true"></i>
        الرئيسية
      </a>
    </div>
  </div>
  <script src="/finance/finance-leadership-360-catalog.js"></script>
  <script src="/tenant-path-client.js?v=20260628-tenant-scope"></script>
  <script>
    (function () {
      const cat = window.FINANCE_LEADERSHIP_360;
      const params = new URLSearchParams(window.location.search);
      const sectionId = params.get('section') || '';
      const pageId = params.get('page') || '';
      const section = cat.getSection(sectionId);
      const page = cat.getPage(sectionId, pageId);
      const titleEl = document.getElementById('page-title');
      const sectionEl = document.getElementById('section-line');
      const noteEl = document.getElementById('note-line');
      if (page) {
        titleEl.textContent = page.label;
        document.title = page.label + ' — قيد التطوير';
      }
      if (section) {
        sectionEl.textContent = 'القسم: ' + section.label;
      }
      if (page && page.note) {
        noteEl.textContent = page.note;
      }
      document.querySelectorAll('a[href^="/"]').forEach((a) => {
        if (typeof window.getTenantScopedPath === 'function') {
          a.setAttribute('href', window.getTenantScopedPath(a.getAttribute('href')));
        }
      });
    })();
  </script>
</body>
</html>
