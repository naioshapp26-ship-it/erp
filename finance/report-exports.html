<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصدير التقارير</title>
  <script src="/finance/finance-context.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Cairo,sans-serif;background:#f8fafc}</style>
</head>
<body class="p-6">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-extrabold mb-2">تصدير التقارير</h1>
    <p class="text-slate-600 mb-4">تنزيل CSV من جداول Postgres الحالية. إن لم توجد صفوف يبقى الملف بالعناوين فقط.</p>
    <div id="alert" class="hidden mb-4 font-bold"></div>
    <div class="flex flex-wrap gap-3">
      <button data-name="invoices" class="bg-slate-900 text-white px-4 py-2 rounded-lg font-bold">فواتير</button>
      <button data-name="customers" class="bg-white border px-4 py-2 rounded-lg font-bold">عملاء</button>
      <button data-name="expenses" class="bg-white border px-4 py-2 rounded-lg font-bold">مصروفات</button>
    </div>
  </div>
  <script>
    function go() {
      const entity = window.getFinanceEntityId ? window.getFinanceEntityId() : '';
      document.querySelectorAll('button[data-name]').forEach((btn) => {
        btn.onclick = () => {
          const q = entity ? `?entity_id=${encodeURIComponent(entity)}` : '';
          window.location = `/finance/ops/export/${btn.dataset.name}${q}`;
        };
      });
    }
    if (window.whenFinanceContextReady) window.whenFinanceContextReady(go); else go();
  </script>
</body>
</html>
