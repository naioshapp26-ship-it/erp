<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأصناف والمنتجات — القيادة المالية 360</title>
  <script src="/finance/finance-context.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body{font-family:'Cairo',sans-serif;background:#f8fafc;color:#0f172a}.number-en{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}</style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
    <header class="mb-6">
      <h1 class="text-3xl font-extrabold mb-1">الأصناف والمنتجات</h1>
      <p class="text-slate-600">سجل مركزي للأصناف والخدمات — حفظ Postgres حقيقي بلا بيانات وهمية</p>
      <nav class="mt-4 flex flex-wrap gap-2 text-sm">
        <a href="/finance/products.html" class="px-3 py-1 rounded-full bg-slate-900 text-white font-bold">الأصناف</a>
        <a href="/finance/inventory.html" class="px-3 py-1 rounded-full bg-white border font-bold">المخزون</a>
        <a href="/finance/purchase-orders.html" class="px-3 py-1 rounded-full bg-white border font-bold">المشتريات</a>
        <a href="/finance/invoices-budgets-master.html" class="px-3 py-1 rounded-full bg-white border font-bold">الفواتير</a>
      </nav>
    </header>

    <div id="alert" class="hidden mb-4 rounded-xl border px-4 py-3 text-sm font-bold"></div>

    <div class="flex flex-wrap gap-3 mb-4">
      <button id="btnAdd" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold"><i class="fas fa-plus ml-1"></i>إضافة صنف</button>
      <button id="btnRefresh" class="bg-white border px-4 py-2 rounded-lg font-bold">تحديث</button>
      <input id="search" class="border rounded-lg px-3 py-2 min-w-[220px]" placeholder="بحث بالرمز أو الاسم أو الفئة">
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-white border rounded-xl p-4"><div class="text-xs text-slate-500">عدد الأصناف</div><div id="statCount" class="text-2xl font-extrabold number-en">0</div></div>
      <div class="bg-white border rounded-xl p-4"><div class="text-xs text-slate-500">سلع متابَعة</div><div id="statTracked" class="text-2xl font-extrabold number-en">0</div></div>
      <div class="bg-white border rounded-xl p-4"><div class="text-xs text-slate-500">خدمات</div><div id="statServices" class="text-2xl font-extrabold number-en">0</div></div>
      <div class="bg-white border rounded-xl p-4"><div class="text-xs text-slate-500">غير نشط</div><div id="statInactive" class="text-2xl font-extrabold number-en">0</div></div>
    </div>

    <div class="bg-white border rounded-2xl overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-500">
            <tr>
              <th class="p-3 text-right">الرمز</th>
              <th class="p-3 text-right">الاسم</th>
              <th class="p-3 text-right">النوع</th>
              <th class="p-3 text-right">الفئة</th>
              <th class="p-3 text-right">تكلفة</th>
              <th class="p-3 text-right">بيع</th>
              <th class="p-3 text-right">حد إعادة الطلب</th>
              <th class="p-3 text-right">الحالة</th>
              <th class="p-3"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="hidden p-10 text-center text-slate-500">
        لا أصناف بعد. أنشئ أول صنف لبدء دورة المخزون والمشتريات.
      </div>
    </div>
  </div>

  <div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl w-full max-w-xl p-6 shadow-xl">
      <h2 id="modalTitle" class="text-xl font-extrabold mb-4">صنف</h2>
      <form id="form" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input type="hidden" id="product_id">
        <label class="text-sm">الرمز (SKU)<input id="sku" class="mt-1 w-full border rounded-lg px-3 py-2"></label>
        <label class="text-sm">النوع
          <select id="product_type" class="mt-1 w-full border rounded-lg px-3 py-2">
            <option value="GOODS">سلعة</option>
            <option value="SERVICE">خدمة</option>
          </select>
        </label>
        <label class="text-sm md:col-span-2">الاسم بالعربية *<input id="name_ar" required class="mt-1 w-full border rounded-lg px-3 py-2"></label>
        <label class="text-sm">الاسم بالإنجليزية<input id="name_en" class="mt-1 w-full border rounded-lg px-3 py-2"></label>
        <label class="text-sm">الفئة<input id="category" class="mt-1 w-full border rounded-lg px-3 py-2"></label>
        <label class="text-sm">الوحدة<input id="unit" value="PCS" class="mt-1 w-full border rounded-lg px-3 py-2"></label>
        <label class="text-sm">تكلفة الشراء<input id="cost_price" type="number" step="0.01" value="0" class="mt-1 w-full border rounded-lg px-3 py-2 number-en"></label>
        <label class="text-sm">سعر البيع<input id="sale_price" type="number" step="0.01" value="0" class="mt-1 w-full border rounded-lg px-3 py-2 number-en"></label>
        <label class="text-sm">حد إعادة الطلب<input id="reorder_level" type="number" step="0.01" value="0" class="mt-1 w-full border rounded-lg px-3 py-2 number-en"></label>
        <label class="text-sm flex items-center gap-2 mt-6"><input id="track_inventory" type="checkbox" checked> متابعة مخزنية</label>
        <label class="text-sm flex items-center gap-2 mt-6"><input id="is_active" type="checkbox" checked> نشط</label>
        <label class="text-sm md:col-span-2">ملاحظات<textarea id="notes" class="mt-1 w-full border rounded-lg px-3 py-2" rows="2"></textarea></label>
        <div class="md:col-span-2 flex justify-end gap-2 mt-2">
          <button type="button" id="btnCancel" class="px-4 py-2 rounded-lg border font-bold">إلغاء</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-slate-900 text-white font-bold">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = location.origin;
    let ENTITY = '';
    let rows = [];

    function headers() {
      return { 'Content-Type': 'application/json', ...(window.getFinanceHeaders ? window.getFinanceHeaders() : {}) };
    }
    function showAlert(msg, ok) {
      const el = document.getElementById('alert');
      el.className = `mb-4 rounded-xl border px-4 py-3 text-sm font-bold ${ok ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}`;
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    function openModal(row) {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
      document.getElementById('modalTitle').textContent = row ? 'تعديل صنف' : 'إضافة صنف';
      document.getElementById('product_id').value = row ? row.product_id : '';
      document.getElementById('sku').value = row ? (row.sku || '') : '';
      document.getElementById('name_ar').value = row ? (row.name_ar || '') : '';
      document.getElementById('name_en').value = row ? (row.name_en || '') : '';
      document.getElementById('product_type').value = row ? (row.product_type || 'GOODS') : 'GOODS';
      document.getElementById('category').value = row ? (row.category || '') : '';
      document.getElementById('unit').value = row ? (row.unit || 'PCS') : 'PCS';
      document.getElementById('cost_price').value = row ? row.cost_price : 0;
      document.getElementById('sale_price').value = row ? row.sale_price : 0;
      document.getElementById('reorder_level').value = row ? row.reorder_level : 0;
      document.getElementById('track_inventory').checked = row ? !!row.track_inventory : true;
      document.getElementById('is_active').checked = row ? !!row.is_active : true;
      document.getElementById('notes').value = row ? (row.notes || '') : '';
    }
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }
    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const filtered = rows.filter(r => {
        if (!q) return true;
        return [r.sku, r.name_ar, r.name_en, r.category].join(' ').toLowerCase().includes(q);
      });
      document.getElementById('statCount').textContent = rows.length;
      document.getElementById('statTracked').textContent = rows.filter(r => r.track_inventory && r.product_type !== 'SERVICE').length;
      document.getElementById('statServices').textContent = rows.filter(r => r.product_type === 'SERVICE').length;
      document.getElementById('statInactive').textContent = rows.filter(r => !r.is_active).length;
      const tbody = document.getElementById('tbody');
      document.getElementById('empty').classList.toggle('hidden', filtered.length > 0);
      tbody.innerHTML = filtered.map(r => `
        <tr class="border-t hover:bg-slate-50">
          <td class="p-3 number-en font-bold">${r.sku || '-'}</td>
          <td class="p-3">${r.name_ar}</td>
          <td class="p-3">${r.product_type === 'SERVICE' ? 'خدمة' : 'سلعة'}</td>
          <td class="p-3">${r.category || '-'}</td>
          <td class="p-3 number-en">${Number(r.cost_price||0).toFixed(2)}</td>
          <td class="p-3 number-en">${Number(r.sale_price||0).toFixed(2)}</td>
          <td class="p-3 number-en">${Number(r.reorder_level||0)}</td>
          <td class="p-3">${r.is_active ? '<span class="text-emerald-700 font-bold">نشط</span>' : '<span class="text-slate-400">موقوف</span>'}</td>
          <td class="p-3 whitespace-nowrap">
            <button class="text-sky-700 font-bold ml-2" data-edit="${r.product_id}">تعديل</button>
            <button class="text-rose-700 font-bold" data-del="${r.product_id}">حذف</button>
          </td>
        </tr>`).join('');
      tbody.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => openModal(rows.find(x => String(x.product_id) === btn.dataset.edit)));
      tbody.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => delProduct(btn.dataset.del));
    }
    async function load() {
      const qs = ENTITY ? `?entity_id=${encodeURIComponent(ENTITY)}` : '';
      const res = await fetch(`${API}/finance/inventory/products${qs}`, { headers: headers() });
      const data = await res.json();
      if (!res.ok) { showAlert(data.error || 'فشل التحميل', false); return; }
      rows = data.products || [];
      render();
    }
    async function delProduct(id) {
      if (!confirm('حذف الصنف؟ يُرفض إن وُجد رصيد أو حركات.')) return;
      const res = await fetch(`${API}/finance/inventory/products/${id}?entity_id=${encodeURIComponent(ENTITY)}`, { method: 'DELETE', headers: headers() });
      const data = await res.json();
      if (!res.ok) { showAlert(data.error || 'فشل الحذف', false); return; }
      showAlert('تم الحذف', true);
      await load();
    }
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('product_id').value;
      const body = {
        entity_id: ENTITY || undefined,
        sku: document.getElementById('sku').value.trim() || undefined,
        name_ar: document.getElementById('name_ar').value.trim(),
        name_en: document.getElementById('name_en').value.trim(),
        product_type: document.getElementById('product_type').value,
        category: document.getElementById('category').value.trim(),
        unit: document.getElementById('unit').value.trim() || 'PCS',
        cost_price: Number(document.getElementById('cost_price').value || 0),
        sale_price: Number(document.getElementById('sale_price').value || 0),
        reorder_level: Number(document.getElementById('reorder_level').value || 0),
        track_inventory: document.getElementById('track_inventory').checked,
        is_active: document.getElementById('is_active').checked,
        notes: document.getElementById('notes').value.trim()
      };
      const res = await fetch(`${API}/finance/inventory/products${id ? '/' + id : ''}`, {
        method: id ? 'PUT' : 'POST', headers: headers(), body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) { showAlert(data.error || 'فشل الحفظ', false); return; }
      closeModal();
      showAlert('تم الحفظ', true);
      await load();
    };
    document.getElementById('btnAdd').onclick = () => openModal(null);
    document.getElementById('btnCancel').onclick = closeModal;
    document.getElementById('btnRefresh').onclick = load;
    document.getElementById('search').oninput = render;

    function boot() {
      ENTITY = window.getFinanceEntityId ? window.getFinanceEntityId() : '';
      load();
    }
    if (window.whenFinanceContextReady) window.whenFinanceContextReady(boot);
    else boot();
  </script>
</body>
</html>
