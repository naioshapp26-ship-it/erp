<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأهداف والعمولات</title>
  <script src="/finance/finance-context.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Cairo,sans-serif;background:#f8fafc}.number-en{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}</style>
</head>
<body class="p-4 md:p-8" data-kind="sales-targets">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-extrabold mb-1">الأهداف والعمولات</h1>
    <p class="text-slate-600 mb-3">الهدف يُقارن بمجموع فواتير الفترة غير الملغاة.</p>
    <nav id="nav" class="flex flex-wrap gap-2 text-sm mb-4"></nav>
    <div id="alert" class="hidden mb-4"></div>
    <div class="grid lg:grid-cols-2 gap-4">
      <form id="form" class="bg-white border rounded-2xl p-4 grid gap-3"></form>
      <div class="bg-white border rounded-2xl p-4">
        <div class="flex gap-2 mb-3">
          <input id="q" class="border rounded-lg px-3 py-2 flex-1" placeholder="بحث">
          <span class="px-3 py-2 font-bold">العدد <span id="count" class="number-en">0</span></span>
          
        </div>
        <div id="extra" class="hidden mb-3 text-sm"></div>
        <div id="empty" class="hidden p-6 text-center text-slate-500">لا سجلات. أنشئ أول سجل من النموذج.</div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="text-slate-500"><tr><th class="p-2 text-right">الرقم</th><th class="p-2 text-right">البيان</th><th class="p-2 text-right">القيمة</th><th class="p-2 text-right">الحالة</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="/finance/ops-ui.js"></script>
</body>
</html>
