<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعدادات الضرائب الداخلية — تشغيل مالي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/finance/finance-workbench.css">
</head>
<body class="fw-body">
  <div class="fw-shell">
    <div id="topnav"></div>
    <header class="fw-hero">
      <div>
        <a class="fw-kicker" href="/finance">القيادة المالية 360</a>
        <h1><i class="fas fa-percent"></i> إعدادات الضرائب الداخلية</h1>
        <p>إدارة أنواع الضرائب والنسب حسب الكيان وتاريخ السريان والإعفاءات، مع سجل تدقيق. المعدلات من إعداداتكم — ليست قواعد قانونية افتراضية ولا تكامل هيئة حكومية.</p>
      </div>
      <div class="fw-actions">
        <button type="button" class="fw-btn fw-btn-ok" id="btn-add"><i class="fas fa-plus"></i> إضافة ضريبة</button>
        <button type="button" class="fw-btn" id="btn-reload"><i class="fas fa-rotate"></i> تحديث</button>
        <a class="fw-btn" href="/finance/invoices-budgets-master.html">الفواتير</a>
        <a class="fw-btn" href="/finance/quick-offers.html">العروض</a>
      </div>
    </header>
    <div id="alert" class="fw-alert info" hidden></div>
    <div class="fw-kpis" id="kpis"></div>
    <div class="fw-toolbar">
      <input type="search" id="q" class="fw-grow" placeholder="بحث بالاسم أو الرمز…">
      <select id="filter-type">
        <option value="">كل الأنواع</option>
        <option value="VAT">VAT</option>
        <option value="Income">Income</option>
        <option value="Corporate">Corporate</option>
        <option value="Custom">Custom</option>
      </select>
      <select id="filter-active">
        <option value="">كل الحالات</option>
        <option value="true">نشطة</option>
        <option value="false">معطّلة</option>
      </select>
      <select id="page-size">
        <option value="20" selected>20 صف</option>
        <option value="50">50 صف</option>
      </select>
    </div>
    <div class="fw-layout">
      <section class="fw-card">
        <div class="fw-card-head"><h2>سجل الإعدادات الضريبية</h2><span id="count" class="fw-badge muted">0</span></div>
        <div id="table-host"></div>
        <div class="fw-pager" id="pager"></div>
      </section>
      <aside class="fw-drawer" id="drawer">
        <div class="fw-empty"><i class="fas fa-hand-pointer"></i>اختر إعدادًا لعرض التفاصيل وسجل التدقيق</div>
      </aside>
    </div>
  </div>

  <div class="fw-modal" id="modal" hidden>
    <form class="fw-sheet" id="form">
      <h2 id="modal-title">إضافة ضريبة</h2>
      <input type="hidden" id="tax_id">
      <div class="fw-form-grid">
        <label>رمز الضريبة *<input id="tax_code" required placeholder="vat_entity_10"></label>
        <label>النوع
          <select id="tax_type">
            <option value="VAT">VAT</option>
            <option value="Income">Income</option>
            <option value="Corporate">Corporate</option>
            <option value="Custom">Custom</option>
          </select>
        </label>
        <label>المعدل (%) *<input id="default_rate" type="number" step="0.01" min="0" required></label>
        <label>الاسم عربي *<input id="tax_name_ar" required></label>
        <label>الاسم إنجليزي<input id="tax_name_en"></label>
        <label>تطبيق على
          <select id="applicable_on">
            <option value="invoice">فاتورة</option>
            <option value="product">منتج</option>
            <option value="service">خدمة</option>
            <option value="all">الكل</option>
          </select>
        </label>
        <label>الكيان<input id="entity_id" placeholder="HQ001 أو فارغ لعام"></label>
        <label>سريان من<input id="effective_from" type="date"></label>
        <label>سريان إلى<input id="effective_to" type="date"></label>
        <label>أولوية<input id="priority" type="number" value="0"></label>
        <label>رقم الفرع<input id="branch_id" type="number"></label>
        <label>معدل الفرع (%)<input id="branch_specific_rate" type="number" step="0.01"></label>
        <label class="wide">أصناف معفاة (فاصلة)<input id="exempt_item_codes" placeholder="EXEMPT-01, ZERO-RATE"></label>
        <label class="wide">الوصف<textarea id="description_ar" rows="2"></textarea></label>
        <label><span><input type="checkbox" id="is_active" checked> مفعّل</span></label>
        <label><span><input type="checkbox" id="is_default"> افتراضي</span></label>
        <label><span><input type="checkbox" id="include_in_total" checked> ضمن الإجمالي</span></label>
      </div>
      <div class="fw-sheet-actions">
        <button type="button" class="fw-btn" id="btn-cancel">إلغاء</button>
        <button type="submit" class="fw-btn fw-btn-primary">حفظ</button>
      </div>
    </form>
  </div>

  <script src="/finance/finance-context.js"></script>
  <script src="/finance/finance-workbench.js"></script>
  <script>
    (function () {
      const FW = window.FinanceWorkbench;
      const state = { rows: [], page: 1, selected: null };

      document.getElementById('topnav').innerHTML = FW.topNav([
        ['/finance', 'اللوحة'],
        ['/manage-tax-settings.html', 'الضرائب'],
        ['/finance/invoices-budgets-master.html', 'الفواتير'],
        ['/finance/quick-offers.html', 'العروض'],
        ['/finance/accounting-integration.html', 'التكامل']
      ], '/manage-tax-settings.html');

      function filtered() {
        const q = document.getElementById('q').value.trim().toLowerCase();
        const type = document.getElementById('filter-type').value;
        const active = document.getElementById('filter-active').value;
        return state.rows.filter((t) => {
          if (type && t.tax_type !== type) return false;
          if (active === 'true' && !t.is_active) return false;
          if (active === 'false' && t.is_active) return false;
          if (!q) return true;
          return `${t.tax_name_ar} ${t.tax_code} ${t.entity_id || ''}`.toLowerCase().includes(q);
        });
      }

      function renderKpis() {
        const all = state.rows;
        const active = all.filter((t) => t.is_active).length;
        const avg = all.length ? (all.reduce((s, t) => s + Number(t.default_rate || 0), 0) / all.length).toFixed(2) : '0';
        const dated = all.filter((t) => t.effective_from || t.effective_to).length;
        document.getElementById('kpis').innerHTML = [
          ['إجمالي الإعدادات', all.length, 'من قاعدة البيانات'],
          ['نشطة', active, 'تُستخدم في الحل'],
          ['بمتوسط معدل', avg + '%', 'ليست قاعدة قانونية'],
          ['بسريان زمني', dated, 'effective_from/to']
        ].map(([a, b, c]) => `<div class="fw-kpi"><span>${a}</span><strong>${b}</strong><em>${c}</em></div>`).join('');
      }

      function renderTable() {
        const host = document.getElementById('table-host');
        const rows = filtered();
        const page = FW.paginate(rows, state.page, Number(document.getElementById('page-size').value) || 20);
        state.page = page.page;
        document.getElementById('count').textContent = String(page.total);
        FW.renderPager(document.getElementById('pager'), page, (p) => { state.page = p; renderTable(); });
        if (!page.total) {
          host.innerHTML = FW.emptyState('لا إعدادات مطابقة', '<div style="margin-top:10px"><button class="fw-btn fw-btn-ok" id="empty-add">إضافة ضريبة</button></div>');
          document.getElementById('empty-add')?.addEventListener('click', openCreate);
          return;
        }
        host.innerHTML = `<div class="fw-table-wrap"><table class="fw-table">
          <thead><tr><th>الاسم</th><th>النوع</th><th>المعدل</th><th>الكيان</th><th>السريان</th><th>الحالة</th><th>إجراءات</th></tr></thead>
          <tbody>${page.rows.map((t) => `
            <tr class="${state.selected === t.id ? 'active' : ''}" data-id="${t.id}">
              <td><strong>${FW.esc(t.tax_name_ar)}</strong><div class="fw-num" style="color:#64748b;font-size:.8rem">${FW.esc(t.tax_code)}</div></td>
              <td>${FW.badge(t.tax_type, 'muted')}</td>
              <td class="fw-num">${FW.esc(t.default_rate)}%</td>
              <td>${FW.esc(t.entity_id || 'عام')}</td>
              <td>${FW.esc((t.effective_from || '—') + ' → ' + (t.effective_to || '—'))}</td>
              <td>${t.is_active ? FW.badge('نشطة', 'ok') : FW.badge('معطّلة', 'bad')}</td>
              <td class="fw-actions" onclick="event.stopPropagation()">
                <button type="button" class="fw-btn fw-btn-mini" data-view="${t.id}">معاينة</button>
                <button type="button" class="fw-btn fw-btn-mini fw-btn-warn" data-edit="${t.id}">تعديل</button>
                <button type="button" class="fw-btn fw-btn-mini" data-toggle="${t.id}">تبديل</button>
              </td>
            </tr>`).join('')}</tbody></table></div>`;
      }

      async function showDetail(id) {
        state.selected = Number(id);
        renderTable();
        const drawer = document.getElementById('drawer');
        drawer.innerHTML = FW.loadingState();
        const [taxRes, auditRes] = await Promise.all([
          FW.api('GET', `/api/tax-settings/${id}`),
          FW.api('GET', `/api/tax-settings/${id}/audit`)
        ]);
        if (!taxRes.ok) {
          drawer.innerHTML = `<div class="fw-error">${FW.esc(taxRes.json?.error || 'تعذر التحميل')}</div>`;
          return;
        }
        const t = taxRes.json;
        const audit = auditRes.json?.audit || [];
        drawer.innerHTML = `
          <h3>${FW.esc(t.tax_name_ar)}</h3>
          <div class="fw-meta">
            <div><span>الرمز</span><strong class="fw-num">${FW.esc(t.tax_code)}</strong></div>
            <div><span>المعدل</span><strong class="fw-num">${FW.esc(t.default_rate)}%</strong></div>
            <div><span>الكيان</span><strong>${FW.esc(t.entity_id || 'عام')}</strong></div>
            <div><span>الحالة</span><strong>${t.is_active ? 'نشطة' : 'معطّلة'}</strong></div>
            <div><span>من</span><strong>${FW.esc(t.effective_from || '—')}</strong></div>
            <div><span>إلى</span><strong>${FW.esc(t.effective_to || '—')}</strong></div>
            <div style="grid-column:1/-1"><span>إعفاءات</span><strong>${FW.esc((t.exempt_item_codes || []).join(', ') || '—')}</strong></div>
            <div style="grid-column:1/-1"><span>أنشئ / عدّل</span><strong>${FW.esc(t.created_by || '—')} / ${FW.esc(t.updated_by || '—')}</strong></div>
          </div>
          <h3 style="margin-top:12px">سجل التدقيق</h3>
          ${audit.length ? `<div class="fw-table-wrap" style="max-height:220px"><table class="fw-table" style="min-width:0">
            <thead><tr><th>الإجراء</th><th>المستخدم</th><th>الوقت</th></tr></thead>
            <tbody>${audit.map((a) => `<tr><td>${FW.esc(a.action)}</td><td>${FW.esc(a.actor || '—')}</td><td>${FW.esc(String(a.created_at || '').replace('T', ' ').slice(0, 19))}</td></tr>`).join('')}</tbody>
          </table></div>` : FW.emptyState('لا تدقيق بعد')}
          <div class="fw-links" style="margin-top:12px">
            <a href="/finance/invoices-budgets-master.html">أثر على الفواتير</a>
            <a href="/finance/accounting-integration.html">التكامل المحاسبي</a>
          </div>`;
      }

      function openCreate() {
        document.getElementById('form').reset();
        document.getElementById('tax_id').value = '';
        document.getElementById('modal-title').textContent = 'إضافة ضريبة';
        document.getElementById('is_active').checked = true;
        document.getElementById('include_in_total').checked = true;
        document.getElementById('modal').hidden = false;
      }

      async function openEdit(id) {
        const res = await FW.api('GET', `/api/tax-settings/${id}`);
        if (!res.ok) return FW.setAlert(document.getElementById('alert'), res.json?.error || 'تعذر التحميل', 'err');
        const t = res.json;
        document.getElementById('tax_id').value = t.id;
        document.getElementById('tax_code').value = t.tax_code || '';
        document.getElementById('tax_name_ar').value = t.tax_name_ar || '';
        document.getElementById('tax_name_en').value = t.tax_name_en || '';
        document.getElementById('tax_type').value = t.tax_type || 'VAT';
        document.getElementById('default_rate').value = t.default_rate;
        document.getElementById('applicable_on').value = t.applicable_on || 'invoice';
        document.getElementById('entity_id').value = t.entity_id || '';
        document.getElementById('effective_from').value = t.effective_from ? String(t.effective_from).slice(0, 10) : '';
        document.getElementById('effective_to').value = t.effective_to ? String(t.effective_to).slice(0, 10) : '';
        document.getElementById('priority').value = t.priority || 0;
        document.getElementById('branch_id').value = t.branch_id || '';
        document.getElementById('branch_specific_rate').value = t.branch_specific_rate || '';
        document.getElementById('exempt_item_codes').value = Array.isArray(t.exempt_item_codes) ? t.exempt_item_codes.join(', ') : '';
        document.getElementById('description_ar').value = t.description_ar || '';
        document.getElementById('is_active').checked = !!t.is_active;
        document.getElementById('is_default').checked = !!t.is_default;
        document.getElementById('include_in_total').checked = t.include_in_total !== false;
        document.getElementById('modal-title').textContent = 'تعديل الضريبة';
        document.getElementById('modal').hidden = false;
      }

      async function load() {
        document.getElementById('table-host').innerHTML = FW.loadingState();
        const res = await FW.api('GET', '/api/tax-settings');
        if (!res.ok) throw new Error(res.json?.error || 'فشل التحميل');
        state.rows = Array.isArray(res.json) ? res.json : [];
        renderKpis();
        renderTable();
        FW.setAlert(document.getElementById('alert'), `تم تحميل ${state.rows.length} إعدادًا من قاعدة البيانات`, 'ok');
      }

      document.getElementById('table-host').addEventListener('click', (e) => {
        const id = e.target.closest('[data-view],[data-edit],[data-toggle],[data-id]')?.getAttribute('data-view')
          || e.target.closest('[data-edit]')?.getAttribute('data-edit')
          || e.target.closest('[data-toggle]')?.getAttribute('data-toggle')
          || e.target.closest('[data-id]')?.getAttribute('data-id');
        if (!id) return;
        if (e.target.closest('[data-edit]')) return openEdit(id);
        if (e.target.closest('[data-toggle]')) {
          return FW.api('PATCH', `/api/tax-settings/${id}/toggle-active`).then(load);
        }
        showDetail(id);
      });

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('tax_id').value;
        const payload = {
          tax_code: document.getElementById('tax_code').value.trim(),
          tax_name_ar: document.getElementById('tax_name_ar').value.trim(),
          tax_name_en: document.getElementById('tax_name_en').value.trim(),
          tax_type: document.getElementById('tax_type').value,
          default_rate: Number(document.getElementById('default_rate').value),
          applicable_on: document.getElementById('applicable_on').value,
          entity_id: document.getElementById('entity_id').value.trim() || null,
          effective_from: document.getElementById('effective_from').value || null,
          effective_to: document.getElementById('effective_to').value || null,
          priority: Number(document.getElementById('priority').value) || 0,
          branch_id: document.getElementById('branch_id').value || null,
          branch_specific_rate: document.getElementById('branch_specific_rate').value || null,
          exempt_item_codes: document.getElementById('exempt_item_codes').value,
          description_ar: document.getElementById('description_ar').value,
          is_active: document.getElementById('is_active').checked,
          is_default: document.getElementById('is_default').checked,
          include_in_total: document.getElementById('include_in_total').checked,
          calculation_method: 'percentage'
        };
        const res = await FW.api(id ? 'PUT' : 'POST', id ? `/api/tax-settings/${id}` : '/api/tax-settings', payload);
        if (!res.ok) {
          FW.setAlert(document.getElementById('alert'), res.json?.error || 'فشل الحفظ', 'err');
          return;
        }
        document.getElementById('modal').hidden = true;
        await load();
        if (res.json?.id) showDetail(res.json.id);
      });

      document.getElementById('btn-add').onclick = openCreate;
      document.getElementById('btn-cancel').onclick = () => { document.getElementById('modal').hidden = true; };
      document.getElementById('btn-reload').onclick = () => load().catch((err) => FW.setAlert(document.getElementById('alert'), err.message, 'err'));
      ['q', 'filter-type', 'filter-active', 'page-size'].forEach((id) => {
        document.getElementById(id).addEventListener('input', () => { state.page = 1; renderTable(); });
        document.getElementById(id).addEventListener('change', () => { state.page = 1; renderTable(); });
      });

      const start = () => load().catch((err) => FW.setAlert(document.getElementById('alert'), err.message, 'err'));
      if (window.whenFinanceContextReady) window.whenFinanceContextReady(start);
      else start();
    })();
  </script>
</body>
</html>
