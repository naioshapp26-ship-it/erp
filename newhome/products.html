<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منتجاتنا | NAIOSH ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/newhome/styles.css" />
  <link rel="stylesheet" href="/newhome/dark-mode.css" />
  <link rel="stylesheet" href="/newhome/products-section.css?v=20260612k" />
</head>
<body>
  <script>try{if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode')}catch(_){}</script>
  <header class="top-nav">
    <div class="container inner">
      <a class="brand" href="/">
        <img src="/public/naiosh-logo.png" alt="شعار نايوش"/>
        <span class="logo-text">NAIOSH ERP</span>
      </a>
      <nav class="nav-links" aria-label="القائمة الرئيسية"></nav>
    </div>
  </header>

  <main class="container products-page">
    <section class="products-hero">
      <h1>منتجاتنا</h1>
      <p>اكتشف مجموعة حلول نايوش ERP المتكاملة المصممة لتحويل أعمالك رقمياً بكفاءة عالية.</p>
      <div class="products-stats">
        <div class="products-stat"><strong data-products-stat="total">190+</strong><span>منتج</span></div>
        <div class="products-stat"><strong data-products-stat="sectors">11</strong><span>قطاعات</span></div>
        <div class="products-stat"><strong>100%</strong><span>رقمي</span></div>
        <div class="products-stat"><strong>ERP</strong><span>متكامل</span></div>
      </div>
    </section>

    <nav class="products-tabs" id="productsTabs" aria-label="أقسام المنتجات"></nav>

    <div id="productsSections"></div>
  </main>

  <nav class="floating-actions" aria-label="أزرار جانبية عائمة">
    <a href="/newhome/ads.html" title="إضافة" aria-label="إضافة"><i class="fas fa-plus"></i></a>
    <a href="/members" title="الأعضاء" aria-label="الأعضاء"><i class="fas fa-heart"></i></a>
    <a href="/contact-empire.html" title="رسائل" aria-label="رسائل"><i class="fas fa-envelope"></i></a>
    <button id="to-top" type="button" aria-label="الصعود للأعلى"><i class="fas fa-arrow-up"></i></button>
  </nav>

  <script src="/newhome/products-catalog.js?v=20260612k"></script>
  <script>
    renderProductsCatalog();
    document.getElementById('to-top')?.addEventListener('click', () => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
    });
  </script>
  <script src="/newhome/landing-nav.js"></script>
  <script src="/newhome/mobile-nav.js"></script>
  <script src="/newhome/dark-mode.js"></script>
</body>
</html>
