<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منتجاتنا | NAIOSH ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/newhome/styles.css" />
  <link rel="stylesheet" href="/newhome/dark-mode.css" />
  <link rel="stylesheet" href="/newhome/products-page.css?v=20260617d" />
</head>
<body class="products-showcase">
  <script>try{if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark-mode')}catch(_){}</script>
  <header class="top-nav">
    <div class="container inner">
      <a class="brand" href="/">
        <img src="/public/naiosh-logo.png" alt="شعار نايوش"/>
        <span class="logo-text">NAIOSH ERP</span>
      </a>
      <nav class="nav-links" aria-label="القائمة الرئيسية"></nav>
    </div>
  </header>

  <main class="products-page">
    <section class="products-hero-premium" aria-labelledby="products-hero-title">
      <div class="products-hero-shapes" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="products-hero-inner">
        <div class="products-hero-badge">
          <i class="fas fa-gem" aria-hidden="true"></i>
          <span>حلول SaaS مؤسسية متكاملة</span>
        </div>
        <h1 id="products-hero-title">منتجاتنا</h1>
        <p class="products-hero-subtitle">
          اكتشف حلول نايوش الذكية المصممة لتحويل عملياتك رقمياً بكفاءة وتميز — منظومة ERP متكاملة تبني الثقة وتسرّع النمو.
        </p>
        <div class="products-hero-ctas">
          <a href="#products-catalog" class="products-cta products-cta-primary">
            <i class="fas fa-compass" aria-hidden="true"></i>
            استكشف الحلول
          </a>
          <a href="/saas-signup.html#step1" class="products-cta products-cta-ghost">
            <i class="fas fa-calendar-check" aria-hidden="true"></i>
            اطلب عرضاً تجريبياً
          </a>
        </div>
      </div>
    </section>

    <section class="products-stats-premium" aria-label="إحصائيات المنتجات">
      <div class="products-stats-grid">
        <article class="products-stat-card">
          <div class="products-stat-icon"><i class="fas fa-layer-group" aria-hidden="true"></i></div>
          <strong data-products-stat="systems">—</strong>
          <span>أنظمة رئيسية</span>
        </article>
        <article class="products-stat-card">
          <div class="products-stat-icon"><i class="fas fa-table-cells" aria-hidden="true"></i></div>
          <strong data-products-stat="modules">—</strong>
          <span>وحدة داخلية</span>
        </article>
        <article class="products-stat-card">
          <div class="products-stat-icon"><i class="fas fa-bolt" aria-hidden="true"></i></div>
          <strong>100%</strong>
          <span>رقمي</span>
        </article>
        <article class="products-stat-card">
          <div class="products-stat-icon"><i class="fas fa-cubes" aria-hidden="true"></i></div>
          <strong>ERP</strong>
          <span>متكامل</span>
        </article>
      </div>
    </section>

    <div class="products-catalog-wrap container" id="products-catalog">
      <p class="products-catalog-hint" id="productsCatalogHint">
        <i class="fas fa-hand-pointer" aria-hidden="true"></i>
        اضغط على أي نظام لعرض محتوياته الداخلية
      </p>
      <div class="products-tabs-scroll">
        <nav class="products-tabs" id="productsTabs" aria-label="أقسام المنتجات"></nav>
      </div>
      <div id="productsSections"></div>
    </div>
  </main>

  <nav class="floating-actions" aria-label="أزرار جانبية عائمة">
    <a href="/newhome/ads.html" title="إضافة" aria-label="إضافة"><i class="fas fa-plus"></i></a>
    <a href="/members" title="الأعضاء" aria-label="الأعضاء"><i class="fas fa-heart"></i></a>
    <a href="/contact-empire.html" title="رسائل" aria-label="رسائل"><i class="fas fa-envelope"></i></a>
    <button id="to-top" type="button" aria-label="الصعود للأعلى"><i class="fas fa-arrow-up"></i></button>
  </nav>

  <script src="/newhome/products-catalog.js?v=20260617d"></script>
  <script>
    renderProductsCatalog().catch((error) => {
      console.error('Failed to render products catalog:', error);
    });

    document.getElementById('to-top')?.addEventListener('click', () => {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
    });

    const statsObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        statsObserver.unobserve(entry.target);
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('.products-stat-card').forEach((card, index) => {
      card.style.transitionDelay = `${index * 80}ms`;
      statsObserver.observe(card);
    });
  </script>
  <script src="/newhome/landing-nav.js"></script>
  <script src="/newhome/mobile-nav.js"></script>
  <script src="/newhome/dark-mode.js"></script>
</body>
</html>
