<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>لوحة التحكم</title>
  <script>
    (function () {
      var match = String(location.pathname || '').match(/^\/t\/([a-z0-9][a-z0-9-]*)/i);
      var loginPath = match ? '/t/' + match[1].toLowerCase() + '/?login=1' : '/login-page.html';
      var cookieMatch = document.cookie.match(/authToken=([^;]+)/);
      var cookieToken = cookieMatch ? decodeURIComponent(cookieMatch[1]) : '';
      var token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || cookieToken;
      if (!token) {
        location.replace(loginPath);
      }
    })();
  </script>
  <link rel="stylesheet" href="/tenant-dashboard-lite.css?v=20260624b">
  <script src="/tenant-path-client.js"></script>
</head>
<body>
  <div class="td-shell">
    <header class="td-topbar">
      <a class="td-brand" href="#" id="td-brand-link">
        <img id="td-brand-logo" src="/public/naiosh-logo.png" alt="الشعار" data-tenant-logo="1">
        <div>
          <h1 id="td-brand-name">لوحة التحكم</h1>
          <p id="td-brand-tagline">منصة متعددة المستأجرين</p>
        </div>
      </a>
      <div class="td-actions">
        <a class="td-btn td-btn-ghost" id="td-branding-link" href="/tenant-branding-settings.html">⚙ الهوية</a>
        <button type="button" class="td-btn td-btn-primary" id="td-logout-btn">↩ خروج</button>
      </div>
    </header>
    <main class="td-main" id="td-main">
      <div class="td-loader">
        <div class="td-spinner"></div>
        <p>جاري تحميل لوحة التحكم...</p>
      </div>
    </main>
  </div>
  <script>
    (function () {
      if (typeof getTenantScopedPath === 'function') {
        var branding = document.getElementById('td-branding-link');
        var brand = document.getElementById('td-brand-link');
        if (branding) branding.href = getTenantScopedPath('/tenant-branding-settings.html');
        if (brand) brand.href = getTenantScopedPath('/dashboard.html');
      }
    })();
  </script>
  <script src="/tenant-dashboard-app.js?v=20260624b"></script>
</body>
</html>
