<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعدادات الدفع — المستأجر</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://js.stripe.com/v3/"></script>
  <style>body{font-family:'Cairo',sans-serif;background:#f8fafc}</style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-black text-slate-800">بوابات الدفع والأرصدة</h1>
        <p class="text-slate-500 text-sm">إعداد Stripe / PayPal / Paymob + شحن الرصيد</p>
      </div>
      <a href="/dashboard.html" class="text-sm text-blue-600 font-bold">← لوحة التحكم</a>
    </div>

    <div id="alert" class="hidden mb-4 p-3 rounded-xl text-sm font-bold"></div>

    <div class="grid md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="font-bold mb-2">رصيدك</h2>
        <div id="creditBalance" class="text-3xl font-black text-blue-600">—</div>
      </div>
      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="font-bold mb-4">شحن الرصيد</h2>
        <div id="bundles" class="space-y-2"></div>
        <select id="creditProvider" class="w-full border rounded-xl p-2 mt-3 mb-2">
          <option value="stripe">Stripe</option>
          <option value="paypal">PayPal</option>
          <option value="paymob">Paymob</option>
        </select>
        <button onclick="startCreditCheckout()" class="w-full bg-blue-600 text-white py-2 rounded-xl font-bold">شحن الآن</button>
        <div id="checkout-container" class="mt-4"></div>
      </div>
    </div>

    <div class="flex gap-2 mb-4">
      <button data-tab="stripe" class="tab-btn bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">Stripe</button>
      <button data-tab="paypal" class="tab-btn bg-white border px-4 py-2 rounded-xl font-bold">PayPal</button>
      <button data-tab="paymob" class="tab-btn bg-white border px-4 py-2 rounded-xl font-bold">Paymob</button>
    </div>

    <div id="panel-stripe" class="panel bg-white rounded-2xl shadow p-6 space-y-3">
      <label class="flex gap-2"><input type="checkbox" id="stripe_enabled"> تفعيل</label>
      <input id="stripe_public" class="w-full border rounded-xl p-3" placeholder="pk_...">
      <input id="stripe_secret" type="password" class="w-full border rounded-xl p-3" placeholder="sk_...">
      <input id="stripe_webhook" type="password" class="w-full border rounded-xl p-3" placeholder="whsec_...">
      <button onclick="saveTenant('stripe')" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">حفظ</button>
    </div>
    <div id="panel-paypal" class="panel hidden bg-white rounded-2xl shadow p-6 space-y-3">
      <label class="flex gap-2"><input type="checkbox" id="paypal_enabled"> تفعيل</label>
      <input id="paypal_client_id" class="w-full border rounded-xl p-3" placeholder="Client ID">
      <input id="paypal_secret" type="password" class="w-full border rounded-xl p-3" placeholder="Secret">
      <button onclick="saveTenant('paypal')" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">حفظ</button>
    </div>
    <div id="panel-paymob" class="panel hidden bg-white rounded-2xl shadow p-6 space-y-3">
      <label class="flex gap-2"><input type="checkbox" id="paymob_enabled"> تفعيل</label>
      <input id="paymob_public" class="w-full border rounded-xl p-3" placeholder="Public Key">
      <input id="paymob_secret" type="password" class="w-full border rounded-xl p-3" placeholder="Secret Key">
      <textarea id="paymob_integrations" class="w-full border rounded-xl p-3 h-20" placeholder='["integration_id"]'></textarea>
      <button onclick="saveTenant('paymob')" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">حفظ</button>
    </div>
  </div>

<script>
let selectedBundle = null;
let stripeInstance = null;

function getToken() {
  return localStorage.getItem('tenant_session') || localStorage.getItem('authToken') || '';
}

function showAlert(msg, ok = true) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = `mb-4 p-3 rounded-xl text-sm font-bold ${ok ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`;
  el.classList.remove('hidden');
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getToken()}`, ...(opts.headers || {}) }
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.message || 'خطأ');
  return data;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn bg-white border px-4 py-2 rounded-xl font-bold');
    btn.className = 'tab-btn bg-blue-600 text-white px-4 py-2 rounded-xl font-bold';
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
  });
});

async function loadBundles() {
  const data = await api('/api/payment/credits/bundles');
  const container = document.getElementById('bundles');
  container.innerHTML = (data.bundles || []).map(b => `
    <button type="button" onclick="selectBundle('${b.id}')" data-bundle="${b.id}"
      class="bundle-btn w-full text-right border rounded-xl p-3 hover:border-blue-400">
      <div class="font-bold">${b.name}</div>
      <div class="text-sm text-slate-500">${b.credits} رصيد — ${b.amount} ${b.currency}</div>
    </button>
  `).join('');
  if (data.bundles?.length) selectBundle(data.bundles[0].id);
}

function selectBundle(id) {
  selectedBundle = id;
  document.querySelectorAll('.bundle-btn').forEach(btn => {
    btn.classList.toggle('border-blue-600', btn.dataset.bundle === id);
    btn.classList.toggle('bg-blue-50', btn.dataset.bundle === id);
  });
}

async function loadBalance() {
  try {
    const data = await api('/api/payment/credits/balance');
    document.getElementById('creditBalance').textContent = `${data.balance} ${data.currency || 'SAR'}`;
  } catch {
    document.getElementById('creditBalance').textContent = '0 SAR';
  }
}

async function startCreditCheckout() {
  if (!selectedBundle) return showAlert('اختر باقة', false);
  try {
    const data = await api('/api/payment/credits/checkout', {
      method: 'POST',
      body: JSON.stringify({
        bundleId: selectedBundle,
        paymentProvider: document.getElementById('creditProvider').value
      })
    });
    if (data.checkoutUrl && !data.clientSecret) {
      window.location.href = data.checkoutUrl;
      return;
    }
    if (data.clientSecret && data.paymentProvider === 'stripe') {
      const keyData = await api('/api/payment/stripe/publishable-key');
      stripeInstance = Stripe(keyData.publishableKey);
      const checkout = await stripeInstance.initEmbeddedCheckout({ clientSecret: data.clientSecret });
      document.getElementById('checkout-container').innerHTML = '';
      checkout.mount('#checkout-container');
      return;
    }
    showAlert('تم إنشاء جلسة الدفع');
  } catch (e) {
    showAlert(e.message, false);
  }
}

async function loadTenantSettings() {
  const data = await api('/api/tenant-settings/payment');
  const map = {};
  (data.data || []).forEach(p => { map[p.provider] = p; });
  if (map.stripe) {
    document.getElementById('stripe_enabled').checked = !!map.stripe.is_enabled;
    document.getElementById('stripe_public').value = map.stripe.stripe_public_key || '';
  }
  if (map.paypal) {
    document.getElementById('paypal_enabled').checked = !!map.paypal.is_enabled;
    document.getElementById('paypal_client_id').value = map.paypal.paypal_client_id || '';
  }
  if (map.paymob) {
    document.getElementById('paymob_enabled').checked = !!map.paymob.is_enabled;
    document.getElementById('paymob_public').value = map.paymob.paymob_public_key || '';
    document.getElementById('paymob_integrations').value = JSON.stringify(map.paymob.paymob_integration_ids || []);
  }
}

async function saveTenant(provider) {
  const body = { is_enabled: false };
  if (provider === 'stripe') {
    body.is_enabled = document.getElementById('stripe_enabled').checked;
    body.stripe_public_key = document.getElementById('stripe_public').value.trim();
    const sk = document.getElementById('stripe_secret').value.trim();
    const wh = document.getElementById('stripe_webhook').value.trim();
    if (sk) body.stripe_secret_key = sk;
    if (wh) body.stripe_webhook_secret = wh;
  } else if (provider === 'paypal') {
    body.is_enabled = document.getElementById('paypal_enabled').checked;
    body.paypal_client_id = document.getElementById('paypal_client_id').value.trim();
    const sec = document.getElementById('paypal_secret').value.trim();
    if (sec) body.paypal_client_secret = sec;
  } else if (provider === 'paymob') {
    body.is_enabled = document.getElementById('paymob_enabled').checked;
    body.paymob_public_key = document.getElementById('paymob_public').value.trim();
    const sec = document.getElementById('paymob_secret').value.trim();
    if (sec) body.paymob_secret_key = sec;
    try { body.paymob_integration_ids = JSON.parse(document.getElementById('paymob_integrations').value || '[]'); }
    catch { return showAlert('Integration IDs غير صالحة', false); }
  }
  try {
    await api(`/api/tenant-settings/payment/${provider}`, { method: 'PUT', body: JSON.stringify(body) });
    showAlert('تم الحفظ');
  } catch (e) { showAlert(e.message, false); }
}

Promise.all([loadBundles(), loadBalance(), loadTenantSettings()]).catch(e => showAlert(e.message, false));
</script>
</body>
</html>
