<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الوصول مرفوض | NAIOSH ERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Cairo, sans-serif;
      background: linear-gradient(135deg, #fff5f5 0%, #ffffff 60%, #f8fafc 100%);
      color: #0f172a;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border: 1px solid #fee2e2;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(215, 0, 0, 0.08);
      padding: 32px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 32px;
      font-weight: 800;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 24px; color: #475569; line-height: 1.8; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a, button {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .primary { background: #d70000; color: #fff; }
    .secondary { background: #f1f5f9; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>الوصول مرفوض</h1>
    <p>لا تملك صلاحية عرض هذه الصفحة. تواصل مع السوبر أدمن لتفعيل الصفحة المطلوبة ضمن نظامك.</p>
    <div class="actions">
      <a class="primary" href="/home">العودة للرئيسية</a>
      <button class="secondary" type="button" onclick="history.back()">رجوع</button>
    </div>
  </div>
</body>
</html>
